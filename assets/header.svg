<svg width="100%" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="45%" stop-color="#091326"/>
      <stop offset="100%" stop-color="#0e2347"/>
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2F5FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'JetBrains Mono', 'Fira Code', -apple-system, BlinkMacSystemFont, monospace;
      font-weight: 600;
      font-size: 19px;
      letter-spacing: 1px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="220" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Glow -->
  <rect x="1" y="1" width="998" height="218" rx="11" fill="none" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Aesthetic Cyberpunk Grid Lines -->
  <line x1="0" y1="40" x2="1000" y2="40" stroke="#00F0FF" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="80" x2="1000" y2="80" stroke="#00F0FF" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="120" x2="1000" y2="120" stroke="#00F0FF" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="160" x2="1000" y2="160" stroke="#00F0FF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Bottom Wave Accent -->
  <path d="M0 185 C200 160 350 215 500 190 C650 165 800 210 1000 185 L1000 220 L0 220 Z" fill="url(#waveGrad)"/>
  <path d="M0 198 C250 175 400 220 600 200 C800 180 900 215 1000 205 L1000 220 L0 220 Z" fill="#00F0FF" fill-opacity="0.15"/>

  <!-- Main Name Title -->
  <text x="500" y="95" text-anchor="middle" fill="url(#glowGrad)" class="title" filter="url(#neonGlow)">Muh. Irfan (BosRvan)</text>

  <!-- Subtitle Badge / Discipline -->
  <text x="500" y="145" text-anchor="middle" fill="#00F0FF" class="subtitle">⚡ FULL-STACK DEVELOPER • SAAS BUILDER • AI AUTOMATION ⚡</text>
</svg>
